services:
  - type: web
    name: mukku-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen-2.5-32b
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
